<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/logo" href="/img/favi_patrimonio.png" />
   <title>NoticiasHoy</title>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md px-8 py-4 flex justify-between items-center">
    <div class="flex items-center">
      <img src="img/logo.png" alt="Logo" class="w-full h-10 mr-2 object-contain">
      <span class="text-xl font-bold">NoticiasHoy</span>
    </div>

    <div class="flex items-center space-x-6 relative">
      <div class="group relative">
        <button class="flex items-center text-gray-700 hover:text-blue-600">
          <ion-icon name="albums-outline" class="text-2xl mr-1"></ion-icon>
          <span>Colecciones</span>
          <ion-icon name="chevron-down-outline" class="text-xl ml-1"></ion-icon>
        </button>
        <div class="absolute hidden group-hover:block bg-white shadow-lg mt-2 rounded-lg py-2 w-40">
          <a href="#" class="flex items-center px-4 py-2 hover:bg-gray-100">
            <ion-icon name="color-palette-outline" class="mr-2"></ion-icon> Bellas Artes
          </a>
          <a href="#" class="flex items-center px-4 py-2 hover:bg-gray-100">
            <ion-icon name="earth-outline" class="mr-2"></ion-icon> Antropología
          </a>
          <a href="#" class="flex items-center px-4 py-2 hover:bg-gray-100">
            <ion-icon name="book-outline" class="mr-2"></ion-icon> Historia
          </a>
        </div>
      </div>

      <a href="nuevo.html" class="flex items-center text-gray-700 hover:text-blue-600">
        <ion-icon name="log-in-outline" class="text-2xl mr-1"></ion-icon>
        <span>Iniciar Sesión</span>
      </a>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1 p-8 space-y-6 flex justify-center" id="noticiasContainer">
    <!-- Aquí se cargarán las noticias dinámicamente -->
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('noticiasContainer');
      const noticias = JSON.parse(localStorage.getItem('noticias')) || [];

      if (noticias.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 text-xl">No hay noticias disponibles.</p>';
        return;
      }

      noticias.forEach((noticia, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-md p-6 w-11/24 mx-4'; // 45% de la pantalla

        card.innerHTML = `
          <div class="flex flex-col space-y-4">
            <img src="${noticia.portada}" alt="Portada" class="w-full h-60 object-cover rounded-lg">
            <h2 class="text-2xl font-bold text-gray-800">${noticia.titulo}</h2>
            <div class="text-gray-600 text-base line-clamp-4">
              ${noticia.contenido}
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg self-start">Ver Noticia</button>
          </div>
        `;

        container.appendChild(card);
      });
    });
  </script>

</body>
</html>
