<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Data Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6">

    <div class="w-full max-w-7xl mb-6">
        <h1 class="text-3xl font-bold text-center mb-8">Carga un Archivo Excel</h1>

        <!-- Input para cargar el archivo Excel -->
        <div class="flex justify-center">
            <input type="file" id="fileInput"
                class="block w-1/2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
    </div>

    <!-- Tabla donde se mostrarán los datos -->
    <div class="w-full max-w-7xl overflow-x-auto">
        <table id="dataTable" class="w-full bg-white border border-gray-200 rounded-lg shadow-lg">
            <thead class="bg-gray-200 text-gray-700">
                <tr id="tableHeaders"></tr>
            </thead>
            <tbody id="tableBody" class="text-gray-600"></tbody>
        </table>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    displayData(jsonData);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function displayData(data) {
            const tableHeaders = document.getElementById('tableHeaders');
            const tableBody = document.getElementById('tableBody');

            // Limpiar la tabla
            tableHeaders.innerHTML = '';
            tableBody.innerHTML = '';

            // Agregar encabezados
            const headers = data[0];
            headers.forEach(header => {
                const th = document.createElement('th');
                th.className = 'p-3 text-left font-semibold border-b';
                th.textContent = header;
                tableHeaders.appendChild(th);
            });

            // Agregar filas de datos
            data.slice(1).forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.className = 'p-3 border-t border-gray-200';
                    td.textContent = cell || ''; // Muestra celda vacía si no tiene datos
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }
    </script>

</body>

</html>
