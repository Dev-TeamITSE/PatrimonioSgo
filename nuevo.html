<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/logo" href="/img/favi_patrimonio.png" />

    <title>Iniciar Sesión</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('img/bandera.jpg');">

    <div class="bg-gradient-to-br from-white/10 to-white/5 backdrop-blur-lg p-10 rounded-3xl shadow-2xl w-96 flex flex-col items-center border border-white/20">
        <img src="img/logo.png" alt="Login Image" class="mb-6">
        <h1 class="text-3xl font-extrabold text-white mb-8 tracking-wide">Iniciar Sesión</h1>

        <form class="w-full flex flex-col gap-5 mb-2">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-400">
                    <ion-icon name="mail-outline" class="text-2xl"></ion-icon>
                </span>
                <input type="email" placeholder="Correo electrónico" class="w-full pl-12 pr-4 py-3 rounded-xl bg-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-400">
                    <ion-icon name="lock-closed-outline" class="text-2xl"></ion-icon>
                </span>
                <input type="password" placeholder="Contraseña" class="w-full pl-12 pr-4 py-3 rounded-xl bg-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex items-center justify-between text-sm text-white">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-blue-500">
                    Recordarme
                </label>
                <a href="#" class="text-black hover:underline">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold tracking-wider transition">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
