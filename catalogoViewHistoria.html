<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrimonio | Antropología</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script> <!-- Cargar SheetJS -->
</head>

<body class="min-h-screen bg-[url('./img/sectores/historia.jpeg')] bg-cover bg-center">

    <!-- Capa oscura para que el contenido se vea mejor -->
    <div class="min-h-screen bg-black bg-opacity-50">
        <header class="py-5 bg-red-400">
            <div class="max-w-[90%] mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <ion-icon name="arrow-back-outline" class="text-2xl"></ion-icon>
                    <a href="historia.html" class="font-semibold pb-1 border-b border-red-400 hover:border-black">Volver atrás</a>
                </div>
                <h3 class="text-5xl text-center text-white font-bold">Historia</h3>
            </div>
        </header>

        <!-- Buscador -->
        <section class="py-10 flex justify-center">
            <div class="flex items-center gap-2 bg-white py-2 px-5 w-[50%] mx-auto rounded-md shadow-md">
                <ion-icon name="search-outline"></ion-icon>
                <input type="text" placeholder="Buscar elemento" class="w-full outline-none">
            </div>
        </section>

        <!-- Tabla tipo catálogo -->
        <section class="pb-20 flex justify-center">
            <div class="bg-white bg-opacity-90 rounded-xl p-6 max-w-[95%] overflow-x-auto shadow-lg w-full">

                <!-- Título de la colección -->
                <div class="flex justify-between items-center mb-4">
                    <input id="coleccion-nombre" type="text" value="Nueva colección" class="text-2xl font-semibold text-gray-800 outline-none border-b border-gray-300 p-2" />
                    
                    <!-- Contenedor para los botones alineados a la derecha -->
                    <div class="flex flex-col items-end gap-4">
                        <!-- Botón para importar archivo Excel -->
                        <button id="importar-btn" class="bg-red-400 hover:bg-red-500 text-white px-4 py-2 rounded-md shadow w-full sm:w-auto">
                            Importar archivo Excel
                        </button>
                        <!-- Botón para confirmar cambios (inicialmente oculto) -->
                        <button id="confirmar-cambios" class="bg-green-400 hover:bg-green-500 text-white px-4 py-2 rounded-md shadow w-full sm:w-auto hidden">
                            Confirmar cambios
                        </button>
                        <!-- Input de archivo Excel (oculto) -->
                        <input type="file" id="excel-file" style="display: none;" />
                    </div>
                </div>

                <table id="tabla-historia" class="min-w-full text-sm text-left mt-6">
                    <thead class="bg-gray-100 text-gray-800" id="table-header">
                        <!-- Los encabezados se agregarán dinámicamente aquí -->
                    </thead>
                    <tbody id="table-body" class="text-gray-800">
                        <!-- Las filas se agregarán dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Mostrar el input de archivo cuando se haga clic en el botón
        document.getElementById("importar-btn").addEventListener("click", function() {
            document.getElementById("excel-file").click();
        });

        // Función para manejar la carga del archivo
        document.getElementById("excel-file").addEventListener("change", handleFile, false);

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = e.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });

                // Asumir que estamos trabajando con la primera hoja
                const sheet = workbook.Sheets[workbook.SheetNames[0]];

                // Convertir los datos de la hoja a JSON
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                // Obtener el cuerpo y encabezado de la tabla
                const tableBody = document.getElementById("table-body");
                const tableHeader = document.getElementById("table-header");

                // Limpiar los datos previos
                tableBody.innerHTML = "";
                tableHeader.innerHTML = "";

                // Cambiar el nombre de la colección según el nombre del archivo
                const filename = file.name.split('.')[0];  // Obtener el nombre sin extensión
                document.getElementById("coleccion-nombre").value = filename;

                // Crear el encabezado dinámicamente basado en las columnas del Excel
                const headerRow = document.createElement("tr");
                rows[0].forEach((header, index) => {
                    const th = document.createElement("th");
                    const input = document.createElement("input");
                    input.type = "text";
                    input.value = header || `Característica ${index + 1}`;
                    input.classList.add("w-full", "p-2", "border", "rounded-md", "bg-gray-200", "text-gray-800");
                    th.appendChild(input);
                    th.classList.add("px-4", "py-2", "border", "bg-white", "border-gray-300");
                    headerRow.appendChild(th);
                });
                tableHeader.appendChild(headerRow);

                // Mostrar los datos en la tabla
                rows.slice(1).forEach((row, rowIndex) => {
                    const tr = document.createElement("tr");
                    row.forEach((cell, cellIndex) => {
                        const td = document.createElement("td");
                        td.textContent = cell || "";
                        td.classList.add("px-4", "py-2", "border");

                        // Habilitar edición de celda con doble clic
                        td.addEventListener("dblclick", function() {
                            const input = document.createElement("input");
                            input.type = "text";
                            input.value = td.textContent;
                            input.classList.add("w-full", "p-2", "border", "rounded-md", "bg-gray-200");

                            input.addEventListener("blur", function() {
                                td.textContent = input.value;
                            });

                            td.textContent = "";
                            td.appendChild(input);
                            input.focus();
                        });

                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

                // Mostrar el botón "Confirmar cambios"
                document.getElementById("confirmar-cambios").classList.remove("hidden");
            };
            reader.readAsBinaryString(file);
        }

        // Evento para el botón "Confirmar cambios"
        document.getElementById("confirmar-cambios").addEventListener("click", function() {
            // Aquí se puede agregar la lógica para guardar los cambios en la base de datos
            alert("Cambios confirmados. Ahora puedes guardarlos en la base de datos.");
        });
    </script>
</body>

</html>
