<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/logo" href="/img/favi_patrimonio.png" />
    <title>Patrimonio | Antropología</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="min-h-screen bg-[url('/img/sectores/antropologia.jpeg')] bg-cover bg-center">
    <header class="py-5 bg-red-400">
        <div class="max-w-[90%] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <ion-icon name="arrow-back-outline" class="text-2xl"></ion-icon>
                <a href="welcome.html" class="font-semibold pb-1 border-b border-red-400 hover:border-black">Volver atrás</a>
            </div>
            <h3 class="text-5xl text-center text-white font-bold">Antropología</h3>
        </div>
    </header>
    <section class="py-10 flex justify-center max-w-[80%] mx-auto">
        <div class="flex items-center gap-2 bg-white py-2 px-5 w-[50%] mx-auto rounded-md">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" placeholder="Buscar elemento" class="w-full outline-none">
        </div>
    </section>

    <div id="contenido-area"></div>

<script>
const area = "antropologia";  // Cambia según la página donde se esté mostrando
const datos = JSON.parse(localStorage.getItem(area)) || [];

const contenidoDiv = document.getElementById("contenido-area");
datos.forEach(item => {
    const section = document.createElement("div");
    section.innerHTML = `<h3>${item.titulo}</h3><p>${item.contenido}</p>`;
    contenidoDiv.appendChild(section);
});
</script>

</body>
</html>
